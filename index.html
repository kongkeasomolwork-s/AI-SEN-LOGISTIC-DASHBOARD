<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="AI SEN LOGO.png">

    <!--=============== REMIXICONS ===============-->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="styles.css">

    <title>AI SEN LOGISTICS - Login</title>
</head>
<body>
    <div class="login">
        <img src="BG-LOGIN.jpg" alt="login image" class="login__img">

        <form id="loginForm" class="login__form">
            <h1 class="login__title">Login</h1>

            <!-- Error Message Banner -->
            <div id="errorMessage" style="color: #ff4d4d; font-size: 0.85rem; margin-bottom: 1rem; display: none; text-align: center;"></div>

            <div class="login__content">
                <div class="login__box">
                    <i class="ri-user-3-line login__icon"></i>

                    <div class="login__box-input">
                        <input type="text" required class="login__input" id="login-user" placeholder=" ">
                        <label for="login-user" class="login__label">Username</label>
                    </div>
                </div>

                <div class="login__box">
                    <i class="ri-lock-2-line login__icon"></i>

                    <div class="login__box-input">
                        <input type="password" required class="login__input" id="login-pass" placeholder=" ">
                        <label for="login-pass" class="login__label">Password</label>
                        <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                    </div>
                </div>
            </div>

            <div class="login__check">
                <div class="login__check-group">
                    <input type="checkbox" class="login__check-input" id="login-check">
                    <label for="login-check" class="login__check-label">Remember me</label>
                </div>

                <a href="#" class="login__forgot">Forgot Password?</a>
            </div>

            <button type="submit" class="login__button" id="loginBtn">Login</button>

            <p class="login__register">
                Don't have an account? <a href="#">Register</a>
            </p>
        </form>
    </div>
    
    <!--=============== LOGIN & UI JS ===============-->
    <script>
        const API_BASE_URL = 'https://logistics-api.xuanwei-aisenlogistic.workers.dev';

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('login-user').value.trim();
            const passwordInput = document.getElementById('login-pass').value.trim();
            const errorBanner = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');

            errorBanner.style.display = 'none';
            loginBtn.innerText = 'Logging in...';
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("loggedInUser", usernameInput);
                    window.location.href = 'homePage.html';
                } else {
                    errorBanner.innerText = result.message || 'Invalid username or password.';
                    errorBanner.style.display = 'block';
                    loginBtn.innerText = 'Login';
                    loginBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorBanner.innerText = 'Connection error. Please check your network or worker URL.';
                errorBanner.style.display = 'block';
                loginBtn.innerText = 'Login';
                loginBtn.disabled = false;
            }
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
